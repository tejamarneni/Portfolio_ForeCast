[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-forecaster"
version = "0.1.0"
description = "Financial portfolio forecasting, risk modeling, and backtesting engine"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.36",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",       # Required for FastAPI TestClient
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.8.0",
]

# Setuptools discovery for src-layout projects
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

# Ruff linter and code formatter
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

# Mypy static type-checking
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true